name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3737
      AUTH_TRUST_HOST: "true"
      ENCRYPTION_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      # Before anything is installed: pure bash + grep, so a violation is
      # reported in seconds rather than after a four-minute build.
      #
      # Its sibling `scripts/check-spec-refs.sh` is NOT here, and the reason is
      # not that it matters less — it is the only gate in this repo that can
      # catch a spec referring to something that does not exist, since
      # `allium check` proves syntax only. It needs the `allium` binary, which
      # has no published install step to put in a workflow. Until it has one,
      # that gate runs from `scripts/hooks/pre-push` and nowhere else.
      - name: Notification writer invariant (ADR-030)
        run: bash scripts/check-notification-writers.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
