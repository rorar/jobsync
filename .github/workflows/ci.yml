name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3737
      AUTH_TRUST_HOST: "true"
      ENCRYPTION_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      # The database-backed test tier (ADR-040) builds a SQLite schema by
      # replaying prisma/migrations through the sqlite3 CLI. Checked here so a
      # missing binary fails in one obvious line instead of inside a 300-suite
      # run. The suite itself also refuses to skip when CI is set, so this is a
      # second line of defence, not the only one.
      - name: Verify sqlite3 (database-backed test tier)
        run: |
          sqlite3 -version || {
            echo "::error::sqlite3 CLI missing. Required by the database-backed test tier (docs/adr/040-database-backed-integration-tests.md)."
            exit 1
          }

      # `allium check` does NOT resolve qualified cross-spec references — verified
      # empirically against allium 3.2.3, a bogus `crm/Nope.field` yields 0 errors.
      # W-H1 replaced hand-copied entity stubs with `crm/...` references. Stubs were
      # UNCHECKABLE (no resolvable link existed, and name-matching would be unsound);
      # qualified references are checkable, and this step is what checks them.
      # See the header of scripts/check-spec-refs.mjs for why the earlier
      # "traded loud for silent" framing was wrong.
      - name: Check cross-spec references
        run: bun run check:spec-refs

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
